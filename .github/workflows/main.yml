name: Build Highway Overdrive APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    container:
      image: barichello/godot-ci:4.2.2

    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java and Android SDK tools
        shell: bash
        run: |
          set -eux

          apt-get update
          apt-get install -y \
            openjdk-17-jdk \
            wget \
            unzip \
            ca-certificates

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/android-tools.zip

          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools

          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          cp -r /tmp/android-tools/cmdline-tools/. \
            "$ANDROID_HOME/cmdline-tools/latest/"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

          chmod +x "$ANDROID_HOME/cmdline-tools/latest/bin/"*

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eux

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$JAVA_HOME/bin:$PATH"

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

          # NDK and CMake are not needed because gradle_build/use_gradle_build=false
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "cmdline-tools;latest"

          echo "Installed Android build tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo "Installed Android platforms:"
          ls -la "$ANDROID_HOME/platforms"

      - name: Install Godot export templates
        shell: bash
        run: |
          set -eux

          # In GitHub container jobs HOME is /github/home, not /root, so Godot looks there.
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.2.stable"
          IMAGE_DIR="/root/.local/share/godot/export_templates/4.2.2.stable"

          mkdir -p "$TEMPLATE_DIR"

          if [ -f "$TEMPLATE_DIR/android_debug.apk" ]; then
            echo "Export templates already present."
          elif [ -f "$IMAGE_DIR/android_debug.apk" ]; then
            echo "Copying export templates from the image."
            cp -r "$IMAGE_DIR/." "$TEMPLATE_DIR/"
          else
            wget -q \
              https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz \
              -O /tmp/godot-templates.tpz

            mkdir -p /tmp/godot-templates
            unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates

            cp -r /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          fi

          ls -la "$TEMPLATE_DIR"
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

      - name: Find and extract Godot project
        shell: bash
        run: |
          set -eux

          PROJECT_DIR=""

          # First, check whether project.godot is already in the repository.
          if find . -name project.godot -type f -print -quit | grep -q .; then
            PROJECT_FILE="$(find . -name project.godot -type f -print -quit)"
            PROJECT_DIR="$(cd "$(dirname "$PROJECT_FILE")" && pwd)"
          else
            # Otherwise, extract the uploaded project ZIP.
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No project.godot file or ZIP file was found."
              echo "Upload your Highway Overdrive project ZIP to the repository root."
              exit 1
            fi

            mkdir -p /tmp/highway-project
            unzip -oq "$ZIP_FILE" -d /tmp/highway-project

            PROJECT_FILE="$(find /tmp/highway-project -name project.godot -type f -print -quit)"

            if [ -z "$PROJECT_FILE" ]; then
              echo "ERROR: The ZIP does not contain a project.godot file."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project found at: $PROJECT_DIR"

          ls -la "$PROJECT_DIR"
          test -f "$PROJECT_DIR/project.godot"

      - name: Configure Java, Android SDK, and APK export
        shell: bash
        run: |
          set -eux

          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.android"
          mkdir -p "$PROJECT_DIR/build"

          # Confirm Java is available at the configured location.
          test -x "$JAVA_HOME/bin/java"
          java -version

          # Create a debug keystore if one does not already exist.
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            "$JAVA_HOME/bin/keytool" -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Tell Godot where Java, the Android SDK and the debug keystore are.
          # (Unquoted EOF so the shell expands $JAVA_HOME, $ANDROID_HOME and $HOME.)
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          # Same settings under a version-named file, in case this build reads that name.
          cp "$HOME/.config/godot/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.2.tres"

          # Create an Android export preset only if the project doesn't already have one.
          # (Unquoted EOF so $HOME expands to the real keystore path.)
          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
          cat > "$PROJECT_DIR/export_presets.cfg" <<EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/HighwayOverdrive.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.highwayoverdrive.game"
          package/name="Highway Overdrive"
          package/signed=true
          keystore/debug="$HOME/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          screen/immersive_mode=true
          EOF
          else
            echo "Using the project's existing export_presets.cfg"
          fi

          echo "Java path:"
          ls -l "$JAVA_HOME/bin/java"

          echo "Android SDK paths:"
          ls -ld "$ANDROID_HOME"
          ls -ld "$ANDROID_HOME/platforms/android-33"
          ls -ld "$ANDROID_HOME/build-tools/33.0.2"

          echo "Export preset:"
          cat "$PROJECT_DIR/export_presets.cfg"

      - name: Enable ETC2/ASTC texture import (required for Android export)
        shell: bash
        run: |
          set -eux

          PG="$PROJECT_DIR/project.godot"
          KEY="textures/vram_compression/import_etc2_astc"

          echo "--- project.godot before ---"
          cat "$PG"

          if grep -q "^$KEY=" "$PG"; then
            sed -i "s|^$KEY=.*|$KEY=true|" "$PG"
          elif grep -q '^\[rendering\]' "$PG"; then
            sed -i "/^\[rendering\]/a $KEY=true" "$PG"
          else
            printf '\n[rendering]\n\n%s=true\n' "$KEY" >> "$PG"
          fi

          echo "--- rendering section after ---"
          grep -n -A5 '^\[rendering\]' "$PG"

          # Drop any stale import cache so textures are re-imported with ETC2/ASTC.
          rm -rf "$PROJECT_DIR/.godot"

      - name: Import Godot project resources
        shell: bash
        run: |
          set -eux

          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          godot --version

          # The editor can exit non-zero after a successful import; the export step catches real failures.
          godot --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit || true

      - name: Build Android APK
        shell: bash
        run: |
          set -eux

          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          mkdir -p "$PROJECT_DIR/build"

          echo "Checking Android SDK..."
          ls -la "$ANDROID_HOME/build-tools/33.0.2"
          ls -la "$ANDROID_HOME/platforms/android-33"

          echo "Checking debug keystore..."
          ls -l "$HOME/.android/debug.keystore"

          echo "Checking Java..."
          java -version
          ls -l "$JAVA_HOME/bin/javac" "$JAVA_HOME/bin/jarsigner"

          echo "Checking Godot environment..."
          echo "HOME=$HOME"
          ls -la "$HOME/.local/share/godot/export_templates/4.2.2.stable" | head -20
          ls -la "$HOME/.config/godot"
          echo "--- editor settings ---"
          cat "$HOME/.config/godot/editor_settings-4.tres"
          echo "--- export preset ---"
          cat "$PROJECT_DIR/export_presets.cfg"
          echo "--- sdk tools ---"
          ls -l "$ANDROID_HOME/platform-tools/adb"
          ls -l "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls -l "$ANDROID_HOME/build-tools/33.0.2/apksigner"

          godot --headless --verbose \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/HighwayOverdrive.apk"

          if [ ! -s "$PROJECT_DIR/build/HighwayOverdrive.apk" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          # Copy into the workspace so the upload step always finds it.
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$PROJECT_DIR/build/HighwayOverdrive.apk" "$GITHUB_WORKSPACE/output/HighwayOverdrive.apk"

          echo "APK successfully created:"
          ls -lh "$GITHUB_WORKSPACE/output/HighwayOverdrive.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Highway-Overdrive-Android-APK
          path: output/HighwayOverdrive.apk
          if-no-files-found: error
          retention-days: 14
